    properties:
      authConfigType: "basicAuth"
      restService: "PercentAttandanceAPI"
      endpoint: "https://aljent-oic-jed-prod01-lrwl7ouc1vb3-je.integration.me-jeddah-1.ocp.oraclecloud.com/ic/api/integration/v1/flows/rest/EMP_PERCEN_PRESEN_REPORT_INT/1.0/GetPercentPresence/report"
      responseConfig: "apiResponse"
      requestHeaders: []
      method: "GET"
      requestParameters:
      - type: "query"
        value: "${(profile.properties.value.personId)!''}"
