    properties:
      variable: "now"
      value: "${.now?string('yyyy-MM-dd')}"
    transitions:
      next: "invokeRangeLLM"
    metadata:
      propertySheetIsFreeMarkerMap:
        variable: false
        value: true
        requiresAuthorization: false
  invokeRangeLLM:
    component: "System.LLM"
    properties:
      outOfScopeKeyword: "InvalidInput"
      enableStreaming: false
      enableMultiTurn: true
      customActions: {}
      sendResponse: false
      addJsonSchemaInstruction: true
      promptTemplateParameters:
        question: "${((skill.question)!'')?replace('<not set>','')}"
        origMsg: "${(skill.userQuestion)!''}"
        langName: "${(skill.userLangName)!'English'}"
        startDate: "${((startDate)!'')?replace('<not set>','')}"
        endDate: "${((endDate)!'')?replace('<not set>','')}"
        now: "${now}"
      retries: 1
      submitButtonLabel: "Submit"
      validateJson: false
      cancelButtonLabel: "Cancel"
      jsonSchema: {}
      temperature: 0
      maxTokens: 256
      resultVariable: "rangeLLMResponse"
      standardActions: ""
      promptTemplate: "You are helping an employee retrieve their ATTENDANCE PRESENCE PERCENTAGE for a date range.\n\nToday's date is ${now}.\n\n============================\nLANGUAGE — ALREADY DECIDED BY THE SYSTEM, DO NOT DETECT IT\n============================\nWrite every \"message\" ENTIRELY in ${langName}, on every turn. Do NOT detect, guess or switch the language, and do NOT infer it from any text below — the examples and the memory contain both Arabic and English, and none of that affects your output. If ${langName} is Arabic every \"message\" is 100% Arabic; if ${langName} is English every \"message\" is 100% English. Never copy example text verbatim — express the idea in ${langName}. All JSON keys and status values are ALWAYS English.\n\n============================\nORIGINAL REQUEST (context only — NOT a language signal)\n============================\n${origMsg}\n\n============================\nCURRENT COLLECTED VALUES\n============================\n- startDate: ${startDate}\n- endDate: ${endDate}\n\n============================\nEMPLOYEE JUST SAID (latest input)\n============================\n${question}\n\n============================\nYOUR JOB\n============================\nDetermine the DATE RANGE (startDate and endDate, both YYYY-MM-DD) the employee wants their attendance percentage for.\n\nRULES:\n- The employee MUST specify a period. If they ask for their attendance percentage WITHOUT naming any period → output status incomplete with a message asking for the period. NEVER assume or default a period yourself.\n- A month name alone (\"december\", \"ديسمبر\"): if it is the CURRENT month → 1st of the month to today. If a past month this year → full month. If that month has not started yet this year → the same month of the PREVIOUS year (full month).\n- \"last month\" / \"الشهر الماضي\" → full previous calendar month.\n- \"this month\" / \"هذا الشهر\" → 1st of the current month to today.\n- \"last week\" / \"الأسبوع الماضي\" → the previous 7 days ending today.\n- \"last N weeks\" / \"اخر N اسابيع\" → today minus N*7 days to today. \"last N days\" / \"اخر N ايام\" → today minus N days to today. \"last N months\" / \"اخر N شهور\" (N up to 3) → today minus N months to today.\n- \"this quarter\" / \"الربع الحالي\" → first day of the current calendar quarter to today.\n- \"from X to Y\" → the given range. If only a start is given (\"since december\") → endDate = today.\n- Accept English and Arabic month names and numeric forms (\"12/2025\").\n- endDate must never be after today — cap it at today.\n- MAXIMUM RANGE: 3 months. If the employee asks for a longer range (\"this year\", \"last 6 months\", \"من بداية السنة\"), output status incomplete with a message (in their language) explaining the attendance percentage can be calculated for up to 3 months at a time, and asking which period they want.\n- Keep previously collected values unless the employee changes them.\n\n============================\nSTATUS\n============================\nCASE A — range determined:\n{\"status\":\"complete\",\"startDate\":\"YYYY-MM-DD\",\"endDate\":\"YYYY-MM-DD\"}\nNo \"message\" field. Do NOT ask for confirmation.\n\nCASE B — no period mentioned, the period is unclear, or the range is longer than 3 months:\n{\"status\":\"incomplete\",\"startDate\":\"\",\"endDate\":\"\",\"message\":\"<ONE short friendly question, written in ${langName}, asking which period they want their attendance percentage for, e.g. a month like August, last month, this quarter, or a date range>\"}\n\nCASE C — the employee wants to CANCEL (\"cancel\", \"stop\", \"never mind\", \"الغاء\", \"إلغاء\", \"لا اريد\", \"خلاص\"):\n{\"status\":\"cancel\",\"startDate\":\"\",\"endDate\":\"\"}\n\nCASE D — the employee's LATEST input is a DIFFERENT request entirely — not a period and not about this attendance percentage: a greeting (hello, مرحبا), leave balance, payslip, submitting a leave, absence history, the attendance check-in/check-out records themselves, a policy question, personal/employment info, or anything else off-topic:\n{\"status\":\"offtopic\",\"startDate\":\"\",\"endDate\":\"\"}\nIMPORTANT: a message that repeats the SAME attendance-percentage request but still without a period (e.g. \"my attendance percentage\", \"نسبة حضوري\") is CASE B (ask again), NOT offtopic.\n\n============================\nEXAMPLES (assume today = 2026-09-13)\n============================\n\"what is my attendance percentage this month\" → {\"status\":\"complete\",\"startDate\":\"2026-09-01\",\"endDate\":\"2026-09-13\"}\n\"my presence percentage for august\" → {\"status\":\"complete\",\"startDate\":\"2026-08-01\",\"endDate\":\"2026-08-31\"}\n\"attendance percentage last month\" → {\"status\":\"complete\",\"startDate\":\"2026-08-01\",\"endDate\":\"2026-08-31\"}\n\"how much did i attend in the last 3 months\" → {\"status\":\"complete\",\"startDate\":\"2026-06-13\",\"endDate\":\"2026-09-13\"}\n\"نسبة حضوري لشهر اغسطس\" → {\"status\":\"complete\",\"startDate\":\"2026-08-01\",\"endDate\":\"2026-08-31\"}\n\"نسبة الحضور هذا الشهر\" → {\"status\":\"complete\",\"startDate\":\"2026-09-01\",\"endDate\":\"2026-09-13\"}\n\"my attendance percentage from 1 july to 15 august\" → {\"status\":\"complete\",\"startDate\":\"2026-07-01\",\"endDate\":\"2026-08-15\"}\n\"what is my attendance percentage\" → {\"status\":\"incomplete\",\"startDate\":\"\",\"endDate\":\"\",\"message\":\"Sure — which period would you like your attendance percentage for? You can say a month like August, last month, this quarter, or a date range.\"}\n\"نسبة حضوري\" → {\"status\":\"incomplete\",\"startDate\":\"\",\"endDate\":\"\",\"message\":\"أكيد — لأي فترة تريد نسبة الحضور؟ يمكنك قول شهر معين، الشهر الماضي، الربع الحالي، أو فترة محددة.\"}\n\"my attendance percentage this year\" → {\"status\":\"incomplete\",\"startDate\":\"\",\"endDate\":\"\",\"message\":\"I can calculate the attendance percentage for up to 3 months at a time — which period would you like?\"}\n\"cancel\" → {\"status\":\"cancel\",\"startDate\":\"\",\"endDate\":\"\"}\n\"الغاء\" → {\"status\":\"cancel\",\"startDate\":\"\",\"endDate\":\"\"}\n\"hello\" → {\"status\":\"offtopic\",\"startDate\":\"\",\"endDate\":\"\"}\n\"what is my leave balance\" → {\"status\":\"offtopic\",\"startDate\":\"\",\"endDate\":\"\"}\n\"show my check in and check out times\" → {\"status\":\"offtopic\",\"startDate\":\"\",\"endDate\":\"\"}\n\n============================\nRULES\n============================\n- Respond with JSON ONLY. No text before or after.\n- ALWAYS output all three fields: status, startDate, endDate (use \"\" when unknown). status is one of: complete, incomplete, cancel, offtopic.\n- The \"message\" field must be written in ${langName}."
      undoButtonLabel: "Undo"
      retryUserMessage: "One moment, please..."
    transitions:
