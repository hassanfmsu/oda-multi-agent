name: "attendancePercentAgent"
trackingId: "AAAA0014-0000-0000-0000-000000000014"
type: "task"
version: "2.0"
interface: {}
configuration:
  requiresAuthorization: false
  defaultApplicationContext: false
  privateThread: false
variables:
- name: "rangeLLMResponse"
  type: "string"
  metadata:
    isFreeMarker: true
  system: false
- name: "startDate"
  type: "string"
  metadata:
    isFreeMarker: true
  system: false
- name: "endDate"
  type: "string"
  metadata:
    isFreeMarker: true
  system: false
- name: "dayStatus"
  type: "string"
  metadata:
    isFreeMarker: true
  system: false
- name: "rangeStatus"
  type: "string"
  metadata:
