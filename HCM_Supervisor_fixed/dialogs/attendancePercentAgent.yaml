defaultTransitions:
  actions:
    system.startTaskFlow: "resetVariables"
states:
  resetVariables:
    component: "System.ResetVariables"
    properties:
      variableList: "rangeLLMResponse,startDate,endDate,dayStatus,rangeStatus,now"
    transitions:
      next: "setnow"
    metadata:
      propertySheetIsFreeMarkerMap:
        variableList: false
        requiresAuthorization: false
  setnow:
