  presenterFallback:
    component: "System.SetVariable"
    properties:
      variable: "skill.finalAnswer"
      value: "I could not calculate your attendance percentage right now. Please try again in a moment.\n\nلم أتمكن من حساب نسبة الحضور حالياً. يرجى المحاولة مرة أخرى بعد قليل."
    transitions:
      next: "outputDirect"
    metadata:
      propertySheetIsFreeMarkerMap:
        variable: false
        value: true
        requiresAuthorization: false
  outputDirect:
    component: "System.CommonResponse"
    properties:
      metadata:
        responseItems:
        - text: "${skill.finalAnswer}"
          type: "text"
      keepTurn: true
    transitions:
      next: "appendHistory"
    metadata:
      virtualComponent: "Virtual.Output"
      propertySheetIsFreeMarkerMap:
        requiresAuthorization: false
  appendHistory:
    component: "System.SetVariable"
    properties:
      variable: "skill.questionAnswerHistory"
      value: "${(skill.questionAnswerHistory)!''}\n\n### Question\n${(skill.userQuestion)!''}\n### Answer\n${skill.finalAnswer}"
    transitions: {}
    metadata:
      propertySheetIsFreeMarkerMap:
        variable: false
        value: true
        requiresAuthorization: false
