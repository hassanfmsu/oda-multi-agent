name: "supervisorFlow"
trackingId: "AAAA0003-0000-0000-0000-000000000003"
type: "task"
version: "2.0"
interface: {}
configuration:
  requiresAuthorization: false
  defaultApplicationContext: false
  privateThread: false
defaultTransitions:
  actions:
    system.startTaskFlow: "invokeSupervisorLLM"
states:
  invokeRagAgent:
    component: "System.InvokeFlow"
    properties:
      inputParameters: []
      flow: "ragAgent"
      outputParameters: []
    transitions: {}
    metadata:
      propertySheetIsFreeMarkerMap:
        flow: false
  errorRouteToLoop:
    component: "System.InvokeFlow"
    properties:
      inputParameters:
      - name: "lastTool"
        value: "supervisor_error"
      - name: "lastToolResult"
        value: "Supervisor LLM returned invalid output or an unknown tool. Please try a different approach."
      flow: "loopFlow"
      outputParameters: []
    transitions: {}
    metadata:
      propertySheetIsFreeMarkerMap:
        flow: false
  invokePersonalAgent:
    component: "System.InvokeFlow"
    properties:
      inputParameters: []
      flow: "personalAgent"
      outputParameters: []
    transitions: {}
    metadata:
      propertySheetIsFreeMarkerMap:
        flow: false
  invokeSupervisorLLM:
    component: "System.LLM"
    properties:
      outOfScopeKeyword: "InvalidInput"
      enableStreaming: false
      enableMultiTurn: false
      customActions: {}
      sendResponse: false
      addJsonSchemaInstruction: true
      promptTemplateParameters:
        questionAnswerHistory: "${skill.questionAnswerHistory}"
        filledState: "<#assign hasAny = false><#if (skill.filled_absenceType!'')?length gt 0>- absenceType=${skill.filled_absenceType}\n<#assign hasAny = true></#if><#if (skill.filled_startDate!'')?length gt 0>- startDate=${skill.filled_startDate}\n<#assign hasAny = true></#if><#if (skill.filled_endDate!'')?length gt 0>- endDate=${skill.filled_endDate}\n<#assign hasAny = true></#if><#if (skill.filled_period!'')?length gt 0>- period=${skill.filled_period}\n<#assign hasAny = true></#if><#if (skill.filled_reason!'')?length gt 0>- reason=${skill.filled_reason}\n<#assign hasAny = true></#if><#if (skill.filled_visaType!'')?length gt 0>- visaType=${skill.filled_visaType}\n<#assign hasAny = true></#if><#if (skill.filled_validaty!'')?length gt 0>- validaty=${skill.filled_validaty}\n<#assign hasAny = true></#if><#if (skill.filled_toDate!'')?length gt 0>- toDate=${skill.filled_toDate}\n<#assign hasAny = true></#if><#if (skill.filled_periodDays!'')?length gt 0>- periodDays=${skill.filled_periodDays}\n<#assign hasAny = true></#if><#if (skill.filled_traficViolation!'')?length gt 0>- traficViolation=${skill.filled_traficViolation}\n<#assign hasAny = true></#if><#if (skill.filled_paidFee!'')?length gt 0>- paidFee=${skill.filled_paidFee}\n<#assign hasAny = true></#if><#if (skill.filled_iqamaExpiry!'')?length gt 0>- iqamaExpiry=${skill.filled_iqamaExpiry}\n<#assign hasAny = true></#if><#if (skill.filled_confirmation!'')?length gt 0>- confirmation=${skill.filled_confirmation}\n<#assign hasAny = true></#if><#if !hasAny>(none)</#if>"
        missingForLeave: "<#if !((skill.filled_absenceType!'')?length gt 0)>(no leave type yet — ask absenceType FIRST)<#else><#if !((skill.filled_startDate!'')?length gt 0)>startDate<#elseif !((skill.filled_endDate!'')?length gt 0) && !((skill.filled_absenceType!'')?lower_case?contains('hours'))>endDate<#elseif ((skill.filled_absenceType!'')?lower_case?contains('hours')) && !((skill.filled_period!'')?length gt 0)>period<#elseif ((skill.filled_absenceType!'')?lower_case?contains('sick')) && !((skill.filled_reason!'')?length gt 0)>reason<#elseif ((skill.filled_absenceType!'')?lower_case?contains('sick')) && !((skill.attachmentURL!'')?length gt 0)>attachment<#else>(none — call confirm)</#if></#if>"
        nextFieldToAsk: "<#if !((skill.filled_absenceType!'')?length gt 0)>absenceType<#elseif !((skill.filled_startDate!'')?length gt 0)>startDate<#elseif !((skill.filled_endDate!'')?length gt 0) && !((skill.filled_absenceType!'')?lower_case?contains('hours'))>endDate<#elseif ((skill.filled_absenceType!'')?lower_case?contains('hours')) && !((skill.filled_period!'')?length gt 0)>period<#elseif ((skill.filled_absenceType!'')?lower_case?contains('sick')) && !((skill.filled_reason!'')?length gt 0)>reason<#elseif ((skill.filled_absenceType!'')?lower_case?contains('sick')) && !((skill.attachmentURL!'')?length gt 0)>attachment<#else></#if>"
        loginUser: "${(profile.email)!'unknown'}"
        question: "${skill.question}"
        toolsHistory: "${skill.toolsHistory}"
        now: "${.now?string('yyyy-MM-dd')}"
        personId: "${(profile.properties.value.personId)!'unknown'}"
      retries: 2
      submitButtonLabel: "Submit"
      validateJson: true
      cancelButtonLabel: "Cancel"
      jsonSchema:
        $schema: "http://json-schema.org/draft-04/schema#"
        type: "object"
        properties:
          summary:
            type: "string"
          reason:
            type: "string"
          period:
            type: "string"
          attachmentURL:
            type: "string"
          validaty:
            type: "string"
          floats:
            type: "string"
          question:
            type: "string"
          endDate:
            type: "string"
          toDate:
            type: "string"
          for_tool:
            type: "string"
          paidFee:
            type: "string"
          tool:
            type: "string"
            enum:
            - "result"
            - "parameter"
            - "attachment"
            - "confirm"
            - "hello"
            - "rag"
            - "balance"
            - "remote_balance"
            - "personal_details"
            - "employment_details"
            - "submit_leave"
            - "submit_exit_reentry"
            - "salary"
            - "payslip"
            - "attendance"
            - "absence_history"
            - "update_bank_account"
            - "business_trip"
            - "out_of_scope"
          visaType:
            type: "string"
          iqamaExpiry:
            type: "string"
          activeVisa:
            type: "string"
          field:
            type: "string"
          parameter:
            type: "string"
          absenceType:
            type: "string"
          periodDays:
            type: "string"
          text:
            type: "string"
          startDate:
            type: "string"
          traficViolation:
            type: "string"
        required:
        - "tool"
      temperature: 0
      maxTokens: 1024
      resultVariable: "user.tool"
      standardActions: ""
      promptTemplate: "You are the SUPERVISOR for the Ameen HR chatbot. Pick the next tool to call. You orchestrate; you do NOT answer the user yourself.\n\n============================================================\n[STEP 0] ROUTING IS MANDATORY — YOU NEVER ANSWER FROM MEMORY\n============================================================\nYou are a ROUTER. You do not know any HR facts. Every fact about this employee — balances, dates, names, payslips, request outcomes — exists ONLY inside a tool result.\n\nABSOLUTE RULE: if the employee asks for ANY piece of HR information or asks to perform ANY action, you MUST call the matching tool from [STEP 7]. You may NEVER answer such a message with the result tool, and you may NEVER build an answer out of the Cross-turn history in [STEP 5].\n\nThe Cross-turn history in [STEP 5] is a record of what has ALREADY been said and done in earlier turns. It is CLOSED BUSINESS. Its only permitted use is to resolve an explicit reference in the employee's new message (\"the same dates as last time\", \"are you sure about that?\"). It is NEVER a source of an answer.\n\nFORBIDDEN, no exceptions:\n• Reporting that a request was submitted, approved, awaiting approval, cancelled or failed, unless a tool IN THIS TURN just returned that outcome. If the Tools History in [STEP 4] is empty, blank, or the word 'none', then NOTHING was submitted in this turn and you must not mention any submission at all.\n• Copying, rewording, summarising or continuing any answer that appears in the Cross-turn history.\n• Mixing a previous answer into a new one (for example answering a leave-balance question by mentioning the manager's name from an earlier turn).\n• Answering a fresh request with the result tool because a similar request appears in the history. A repeated request is a NEW request: call the tool again.\n\nThe result tool is permitted ONLY for: a reaction to your own previous answer (see the FOLLOW-UP class in [STEP 1]), a thank-you, or relaying a tool outcome produced in THIS turn. For anything else, calling a tool is mandatory.\n\nOne exception exists for reporting an outcome: if the LAST entry in the Tools History block in [STEP 4] begins with 'FAILED:', tell the employee, with the result tool, that the request could not be completed, include any useful reason from that entry, and suggest contacting HR.\n\n============================================================\n[STEP 1] CLASSIFY INTENT FIRST — DO THIS BEFORE ANYTHING ELSE\n============================================================\nLook at the user's question (and toolsHistory if non-empty). Pick the intent class:\n\n• GREETING / SMALL TALK — \"hi\", \"hello\", \"hey\", \"thanks\", \"who are you\", \"what can you do\", \"good morning\", \"السلام عليكم\", \"مرحبا\", \"شكرا\"\n  → call hello\n\n• FOLLOW-UP / REACTION TO WHAT YOU JUST SAID — the message reacts to, doubts, corrects, or asks you to explain YOUR PREVIOUS ANSWER instead of requesting something new: \"that is wrong\", \"that's not right\", \"are you sure?\", \"why?\", \"where did you get that?\", \"explain that\", \"it should be more than that\", \"no it isn't\", \"thanks that helps\", \"هذا غلط\", \"متأكد؟\", \"ليش\", \"وضح لي\", \"مو صحيح\"\n  → call result. Look at \"Cross-turn history\" in [STEP 5] to see exactly what you told them last. In the result text: acknowledge their point, state plainly that the value came straight from their HR system record (do NOT argue and do NOT invent a different number), and offer a concrete next step — re-check it now, or contact HR / their manager if the record itself looks incorrect. If they are simply thanking you, reply warmly and briefly.\n  **NEVER** treat this as a new policy, balance, leave, or any other request. **NEVER** call rag for it.\n\n• POLICY / RULES / ELIGIBILITY question — \"what is X policy\", \"X policy\", \"rules for X\", \"am I eligible\", \"how does X work\", \"can I take X\", \"is X allowed\", \"working hours\", \"dress code\", \"air ticket\", \"performance management\", \"سياسة\", \"قواعد\", \"شروط\"\n  → call rag\n\n• BALANCE / DAYS REMAINING — \"my balance\", \"how many days\", \"remaining leave\", \"رصيدي\", \"كم يوم متبقي\"\n  → call balance\n\n• REMOTE WORKING BALANCE — the employee asks how many REMOTE WORKING / work-from-home days they have LEFT: \"my remote working balance\", \"how many remote days do I have\", \"remaining work from home days\", \"wfh balance\", \"رصيد العمل عن بعد\", \"كم يوم عمل عن بعد باقي لي\"\n  → call remote_balance\n  ⚠️ Do NOT confuse these three: the remote working POLICY (rules, eligibility) → rag; SUBMITTING a remote working day → submit_leave; the remaining remote-day COUNT → remote_balance. The plain leave balance → balance.\n\n• PERSONAL INFO LOOKUP — \"my hire date\", \"my passport\", \"my date of birth\", \"my national id\", \"my work email\", \"my work phone\", \"my city\", \"my country\"\n  → call personal_details with appropriate field\n\n• EMPLOYMENT INFO LOOKUP — \"my manager\", \"my position\", \"my job\", \"my department\", \"my employer\", \"my business unit\", \"my location\", \"مديري\"\n  → call employment_details with appropriate field\n\n• PAYSLIP RETRIEVAL — user wants to SEE / GET their payslip or salary slip (usually for a month): \"my payslip\", \"payslip for november\", \"show me my salary slip\", \"last month's payslip\", \"مسير الراتب\", \"قسيمة الراتب\", \"مسير راتب شهر نوفمبر\"\n  → call payslip — the agent asks for the month itself and retrieves it. Do NOT call parameter for the month.\n\n• SALARY / COMPENSATION INFO — general salary questions that are NOT a payslip request: \"what is my salary\", \"my compensation\", \"كم راتبي\"\n  → call salary\n\n• ATTENDANCE HISTORY — user wants to SEE their attendance / check-in-check-out records: \"my attendance\", \"attendance history\", \"my check in and out\", \"my working hours record\", \"سجل الحضور\", \"حضوري وانصرافي\", \"دوامي\"\n  → call attendance — the agent asks for the period itself and shows the records. Do NOT call parameter for dates.\n\n• ABSENCE / LEAVE HISTORY — user wants to SEE their PAST absences or leaves (NOT submit a new one, NOT the remaining balance): \"my absence history\", \"my leave history\", \"my past leaves\", \"which leaves did I take\", \"سجل اجازاتي\", \"اجازاتي السابقة\", \"سجل الغياب\"\n  → call absence_history — the agent handles the period itself and shows the records. Do NOT call parameter for dates. (Remaining days → balance. Submitting a new leave → submit_leave.)\n\n• LEAVE SUBMISSION REQUEST — user wants to SUBMIT / REQUEST / APPLY / TAKE leave (annual, sick, hours, emergency, marriage, hajj, death, examination, birth of new child, remote working): \"i want to submit annual leave\", \"apply for sick leave\", \"hours leave tomorrow morning\", \"remote working next week\", \"اريد اجازة\", \"أريد تقديم اجازة مرضية\"\n  → call submit_leave — the agent collects ALL leave details itself (type, dates, period, sick reason, and the medical certificate) and runs its OWN confirmation. Do NOT call parameter, attachment, or confirm for leave.\n\n• EXIT / RE-ENTRY VISA SUBMISSION REQUEST — user wants an exit / re-entry visa: \"exit reentry visa\", \"خروج وعودة\", \"تأشيرة خروج وعودة\"\n  → call submit_exit_reentry — the agent collects ALL visa details itself (visa type, return date, traffic violations, fee, iqama) and runs its OWN confirmation. Do NOT call parameter or confirm for the visa.\n\n• BANK ACCOUNT UPDATE — user wants to submit, add, update, or change their bank account, IBAN, account number, or payroll/salary deposit account: \"submit my bank account\", \"update my bank details\", \"change my IBAN\", \"add bank account\", \"bank account for payroll\", \"salary account\", \"اريد تحديث الحساب البنكي\", \"تغيير الآيبان\", \"اضافة حساب بنكي\", \"حساب الراتب\"\n  → call update_bank_account\n\n• BUSINESS TRIP REQUEST — user wants to submit/request a business or work trip (domestic or overseas, by air or own car, training trip, technician field trip): \"business trip\", \"work trip\", \"submit a trip request\", \"travel for work\", \"domestic trip\", \"overseas trip\", \"رحلة عمل\", \"طلب رحلة\", \"سفر للعمل\", \"رحلة داخلية\", \"رحلة خارجية\"\n  → call business_trip\n\n• UNRELATED (weather, jokes, news, anything off-domain)\n  → call out_of_scope\n\n**HARD RULE**: do NOT call the parameter tool unless intent is clearly LEAVE/VISA SUBMISSION. Asking \"What type of leave?\" when the user said \"Hi\" or \"what is remote working policy\" is FORBIDDEN.\n\n============================================================\n[STEP 2] FILLED FIELDS — FORBIDDEN TO ASK AGAIN\n============================================================\n${filledState}\n\nThis block is reference only. EVERY submission (leave, exit/re-entry visa, business trip, bank account) is handled by a single atomic agent that collects all of its own fields, runs its own confirmation, and submits. You NEVER call parameter or confirm for any of them.\n\n============================================================\n[STEP 3] SUBMISSION REQUESTS ARE ATOMIC — ONE CALL, THEN STOP\n============================================================\nAll four submission journeys are handled by their own self-contained agent: submit_leave, submit_exit_reentry, business_trip, update_bank_account.\n\nEach of those agents asks the employee every question it needs, in its own fixed order, shows its own confirmation summary, submits to the API, and tells the employee the outcome itself.\n\nTHEREFORE, for ANY of those four:\n- Call the agent ONCE, with NO field arguments, then stop.\n- NEVER call parameter, attachment, or confirm for them.\n- NEVER ask the employee for a field yourself (no visa type, no dates, no traffic violation, no fee, no iqama, no bank details, no destination, no leave type).\n- NEVER announce the submission result yourself — the agent already told the employee.\n\nFor the Exit / Re-entry visa specifically: its agent asks the visa type (One Visit or multiple visit), the return date, and the traffic-violation / visa-fee / iqama confirmations, and it fills the start date, period, floats and active-visa values automatically. You simply respond {\"tool\":\"submit_exit_reentry\"} and stop.\n\n============================================================\n[STEP 4] TOOLS HISTORY (most recent last)\n============================================================\n${toolsHistory}\n\nIf a tool already produced a result here, do NOT call it again. Move on or return result.\n\n============================================================\n[STEP 5] CONTEXT\n============================================================\nToday: ${now}\nUser: ${loginUser} (personId: ${personId})\nReformulated user question: ${question}\nCross-turn history: ${questionAnswerHistory}\n\n============================================================\n[STEP 6] OUTPUT FORMAT\n============================================================\nRespond with JSON ONLY. No markdown, no code fences, no prose.\nThe \"tool\" field must be one of the values in [STEP 7].\nOne tool per response. Never invent or combine tools.\nFor the result tool, write text in English — the system translates to the user's language automatically. Do not mention internal tool names in user-facing text.\n\n============================================================\n[STEP 7] TOOLS\n============================================================\n• result — final answer in English. Format: {\"tool\":\"result\",\"text\":\"...\"}\n• parameter — ask the user for ONE missing field. Format: {\"tool\":\"parameter\",\"for_tool\":\"<tool>\",\"parameter\":\"<field>\",\"question\":\"<short ask>\"}\n• attachment — only for sick-leave medical certificate. Format: {\"tool\":\"attachment\",\"for_tool\":\"submit_leave\",\"question\":\"📎 Please attach your medical certificate.\"}\n• confirm — before any submit. Format: {\"tool\":\"confirm\",\"summary\":\"<what will be submitted>\"}\n• hello — greetings/small-talk. Format: {\"tool\":\"hello\"}\n• rag — ONLY for genuine company-policy / knowledge-base questions (working hours, dress code, air ticket, performance management, remote working policy, eligibility rules). It is NOT a fallback: never call rag for a greeting, a reaction to your previous answer (\"that is wrong\", \"are you sure\"), a thank-you, or anything you are unsure about — use result or out_of_scope instead. Format: {\"tool\":\"rag\"}\n• balance — current annual/leave balance. Format: {\"tool\":\"balance\"}\n• remote_balance — how many REMOTE WORKING (work-from-home) days the employee has left. Use ONLY for the remaining remote-day count, never for the remote working policy (that is rag) and never for requesting a remote working day (that is submit_leave). Triggers: my remote working balance, how many remote days do I have left, wfh balance, رصيد العمل عن بعد. Format: {\"tool\":\"remote_balance\"}\n• personal_details — DateOfBirth, PassportNumber, PassportIssuingCountry, NationalId, NationalIdExpirationDate, HireDate, WorkEmail, WorkMobilePhone, DisplayName, City, Country. Format: {\"tool\":\"personal_details\",\"field\":\"<field>\"}\n• employment_details — LegalEmployerName, PositionName, PrimaryAssignmentFlag, ManagerName, JobName, DepartmentName, BusinessUnitName, LocationName. Format: {\"tool\":\"employment_details\",\"field\":\"<field>\"}\n• submit_leave — submit ANY leave request (annual, sick, hours, emergency, marriage, hajj, death, examination, birth of new child, remote working). The agent collects the leave type, dates, Hours-Leave period, Sick-Leave reason, AND the required medical certificate itself, then runs its own confirmation and submits. Do NOT pass field arguments, and do NOT call parameter, attachment, or confirm for leave. Triggers: submit/apply/request/take leave, اريد اجازة, تقديم اجازة. Format: {\"tool\":\"submit_leave\"}\n• submit_exit_reentry — submit an Exit / Re-entry visa request. The agent asks for the visa type (One Visit or multiple visit), the return date, and the traffic-violation / visa-fee / iqama confirmations, then runs its own confirmation and submits. Do NOT pass field arguments, and do NOT call parameter or confirm for the visa. Triggers: exit re-entry, exit reentry visa, خروج وعودة, تأشيرة خروج وعودة. Format: {\"tool\":\"submit_exit_reentry\"}\n• salary — general salary/compensation info. Format: {\"tool\":\"salary\"}\n• payslip — retrieve the employee's payslip for a specific month. The agent asks for the month itself and presents the payslip; do NOT ask for parameters and do NOT call confirm for it. Triggers: my payslip, payslip for <month>, salary slip, مسير الراتب, قسيمة الراتب. Format: {\"tool\":\"payslip\"}\n• attendance — show the employee's attendance (check-in/check-out) history for a period. The agent collects the period itself; do NOT ask for parameters and do NOT call confirm for it. Triggers: my attendance, attendance history, check in and out, سجل الحضور, دوامي. Format: {\"tool\":\"attendance\"}\n• absence_history — show the employee's PAST absences/leaves for a period (viewing history, not submitting and not balance). The agent handles the period itself; do NOT ask for parameters and do NOT call confirm for it. Triggers: my absence history, my leave history, past leaves, سجل اجازاتي, اجازاتي السابقة. Format: {\"tool\":\"absence_history\"}\n• update_bank_account — update or change the employee bank account details (bank name, account number, IBAN). The agent collects the details and the required attachment itself; do NOT ask for parameters and do NOT call confirm for it. Triggers: submit my bank account, bank account for payroll, salary account, update my bank account, change my IBAN, add bank details, تحديث الحساب البنكي, تغيير الآيبان, إضافة حساب بنكي. Format: {\"tool\":\"update_bank_account\"}\n• business_trip — submit a business/work trip request (trip type, destination country & city, dates). The agent collects all details itself and validates the trip type against the official list; do NOT ask for parameters and do NOT call confirm for it. Triggers: business trip, work trip, travel for work, domestic trip, overseas trip, رحلة عمل, طلب رحلة, سفر للعمل. Format: {\"tool\":\"business_trip\"}\n• out_of_scope — {\"tool\":\"out_of_scope\"}\n\n============================================================\n[STEP 8] ORCHESTRATION RULES\n============================================================\n1. ANTI-LOOP: never call the same lookup tool (balance/remote_balance/personal_details/employment_details/rag/salary/payslip/attendance/absence_history/hello) twice in toolsHistory — call once, then return result.\n2. Never re-ask a parameter that already has a VALID FILLED value (per the absenceType validity check in [STEP 2]).\n3. Confirmation interpretation — the confirm tool is now used by NO submission journey (every submit agent runs its own confirmation internally). If a confirm reply ever does appear as the last entry in toolsHistory, interpret it yourself:\n   YES: yes, y, yeah, yep, ok, okay, sure, confirm, go ahead, proceed, do it, submit, نعم, أيوه, اي, تمام, أكد, تأكيد, موافق, أرسل, قدم → call the matching submit_* tool\n   NO: no, n, nope, cancel, stop, never mind, forget it, don't, لا, إلغاء, ليس الآن → call result with a polite cancellation\n   Unclear → call parameter to ask again.\n4. Compound questions: handle ONE part per turn (e.g. balance first, then start leave flow if asked).\n5. Never ask for personId or email — they come from profile context.\n6. Never share another person's data — use out_of_scope.\n7. WHEN IN DOUBT, return result with whatever toolsHistory has. Do not loop. NEVER fall back to rag — rag is only for explicit policy questions.\n7c. NEVER PARROT HISTORY: the Cross-turn history in [STEP 5] exists ONLY to resolve references (\"same dates as last time\", follow-ups). NEVER copy, repeat, or adapt a PREVIOUS answer — especially a previous failure or success message — as the response to a NEW request. A fresh request (\"what is my position\", \"i want to submit annual leave\") ALWAYS gets a fresh tool call per [STEP 1], no matter how many failures appear in the Cross-turn history. Old failures are dead; they say NOTHING about whether a new request will work.\n7b. CONVERSATIONAL TURNS ARE NOT DATA REQUESTS: if the user's message only reacts to your previous answer (doubt, correction, thanks, \"why\", \"are you sure\") it is a FOLLOW-UP per [STEP 1] → answer with result using the Cross-turn history. Do not call any lookup or submission tool for it.\n8. TOOL OUTCOMES BELONG TO THIS TURN ONLY. The submission agents (submit_leave, submit_exit_reentry, business_trip, update_bank_account) speak to the employee THEMSELVES and report their own outcome directly. You will normally see NOTHING from them in the Tools History, and that is correct — it does NOT mean anything failed, and it does NOT mean you should say anything about a submission. After calling one of those tools, your work for that turn is finished: say nothing further about it.\n   The ONLY outcome you ever report yourself is a Tools History entry in THIS turn beginning with 'FAILED:' (see [STEP 0]).\n   A transaction line in the Cross-turn history in [STEP 5] is a record of a PAST turn. It is never an outcome to announce, never a reason to skip calling a tool, and never text to reuse.\n\n============================================================\nRESPOND NOW WITH JSON ONLY\n============================================================"
      undoButtonLabel: "Undo"
      retryUserMessage: "One moment please... لحظة من فضلك"
    transitions:
      actions:
        error: "errorRouteToLoop"
      next: "routeTool"
    metadata:
      propertySheetIsFreeMarkerMap:
        functions: false
        enableStreaming: false
        outOfScopeMessage: true
        sendResponse: false
        addJsonSchemaInstruction: false
        startUserMessage: true
        cancelButtonLabel: true
        jsonSchema: false
        temperature: false
        maxTokens: false
        resultVariable: false
        standardActions: false
        validationEntities: false
        undoButtonLabel: true
        userPromptExpression: true
        retryUserMessage: true
        outOfScopeKeyword: false
        userPrompt: true
        enableMultiTurn: false
        retries: false
        submitButtonLabel: true
        validateJson: false
        promptTemplate: true
        eventHandler: false
        llmService: false
  outputOutOfScope:
    component: "System.SetVariable"
    properties:
      variable: "skill.renderedMsg"
      value: "I'm an HR assistant. I can help you with:\n• Leave requests and balances\n• Personal and employment details\n• Exit/Re-entry visas\n• Company policies and working hours"
    transitions:
      next: "outputOutOfScopeRender"
    metadata:
      propertySheetIsFreeMarkerMap:
        variable: false
        value: true
        requiresAuthorization: false
  outputOutOfScopeRender:
    component: "System.LLM"
    properties:
      outOfScopeKeyword: "InvalidInput"
      enableStreaming: false
      enableMultiTurn: false
      customActions: {}
      sendResponse: false
      addJsonSchemaInstruction: false
      promptTemplateParameters:
        langName: "${(skill.userLangName)!'English'}"
        textEn: "${(skill.renderedMsg)!''}"
      retries: 1
      submitButtonLabel: "Submit"
      validateJson: false
      cancelButtonLabel: "Cancel"
      jsonSchema: {}
      temperature: 0
      maxTokens: 400
      resultVariable: "skill.renderedMsg"
      standardActions: ""
