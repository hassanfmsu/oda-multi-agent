      resultVariable: "skill.llmResp"
      standardActions: ""
      promptTemplate: "Map the user's text to ONE canonical Sick-Leave reason. Output ONLY the canonical value exactly as spelled below. No explanation. No quotes. No extra words.\n\nCanonical values (exact spelling):\n- Arthritis\n- Contagious illness\n- Diarrhea\n- Flu\n- General Allergies\n- General Injuries\n- Headache\n- High Fever\n- Illness that negatively impacts productivity\n- Indigestion\n- Other\n- Sinusitis\n- Surgery\n- Torn ligament\n- Vomiting\n\nMappings:\n- cold, flu, زكام, برد, إنفلونزا, انفلونزا → Flu\n- stomach ache, indigestion, عسر هضم, ألم بالمعدة → Indigestion\n- headache, migraine, صداع, شقيقة → Headache\n- high fever, temperature, حرارة, حمى → High Fever\n- vomiting, nausea, throwing up, استفراغ, غثيان, ترجيع → Vomiting\n- allergy, allergies, حساسية → General Allergies\n- diarrhea, اسهال, إسهال → Diarrhea\n- surgery, operation, عملية, جراحة → Surgery\n- injury, injuries, إصابة, إصابات → General Injuries\n- arthritis, joint pain, التهاب المفاصل → Arthritis\n- sinus, sinusitis, جيوب أنفية → Sinusitis\n- torn ligament, sprain, تمزق, رباط → Torn ligament\n- contagious, infectious, معدي, عدوى → Contagious illness\n\nIf the text does not clearly match any specific reason above, output exactly: Other\n\nUser text: \"${userText}\"\n\nOutput:"
