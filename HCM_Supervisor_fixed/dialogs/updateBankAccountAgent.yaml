  classifyConfirm:
    component: "System.LLM"
    properties:
      outOfScopeKeyword: "InvalidInput"
      enableStreaming: false
      enableMultiTurn: false
      customActions: {}
      sendResponse: false
      addJsonSchemaInstruction: false
      promptTemplateParameters:
        confirmReply: "${((confirmReply)!'')?replace('<not set>','')}"
      retries: 1
      submitButtonLabel: "Submit"
      validateJson: false
      cancelButtonLabel: "Cancel"
      jsonSchema: {}
      temperature: 0
      maxTokens: 8
      resultVariable: "confirmResult"
      standardActions: ""
      promptTemplate: "The employee was shown a bank account update summary and asked to confirm submitting it. Classify their reply into EXACTLY one word: YES, NO, or EDIT.\n\n- YES: a clear affirmative with NO change requested (yes, yeah, sure, ok, go ahead, confirm, submit, do it, نعم, ايوه, اي, أكيد, تمام, موافق, ارسل, ماشي).\n- EDIT: the employee wants to CHANGE or CORRECT a detail, or gives new/different information (a bank name, account number, IBAN) — EVEN IF the message starts with 'no'. Examples: 'no, the IBAN is SA44...', 'change the account number', 'its Alrajhi not SNB', 'لا الآيبان هو...', 'غير رقم الحساب'.\n- NO: a pure cancel/refusal with NO new detail (no, nope, cancel, stop, never mind, لا, إلغاء, الغاء, كنسل, توقف, مو الان).\n\nIf the reply contains ANY concrete detail (a bank name, a number, an IBAN), choose EDIT, not NO.\n\nEmployee reply: \"${confirmReply}\"\n\nOutput EXACTLY one word: YES, NO, or EDIT."
      undoButtonLabel: "Undo"
      retryUserMessage: "One moment, please..."
    transitions:
      next: "switchConfirm"
    metadata:
      propertySheetIsFreeMarkerMap:
        outOfScopeKeyword: false
        enableStreaming: false
        userPrompt: true
        outOfScopeMessage: true
        enableMultiTurn: false
