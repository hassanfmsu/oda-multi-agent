      requestHeaders: []
      method: "POST"
      requestBody: "{\n    \"personID\": \"${(profile.properties.value.personId)!''}\",\n  \"email\": \"${(profile.email)!''}\",\n    \"documentRecordsDFF\": [\n        {\n            \"bankName\": \"${((bankName)!'')?json_string}\",\n            \"iban\": \"${((iban)!'')?json_string}\",\n            \"accountNumber\": \"${((accountNumber)!'')?json_string}\",\n            \"bankBranch\": \"\"\n        }\n    ],\n    \"attachments\": [\n        {\n            \"FileName\": \"${((bankAttFileName)!'Bank_Attachment')?json_string}\",\n            \"AttachmentURL\": \"${((bankAttachment)!'')?json_string}\"\n        }\n    ]\n}"
