states:
  callTripAPI:
    component: "System.CallRestService"
    properties:
      authConfigType: "basicAuth"
      restService: "BusinessTripRequest"
      endpoint: "https://aljent-oic-jed-prod01-lrwl7ouc1vb3-je.integration.me-jeddah-1.ocp.oraclecloud.com/ic/api/integration/v1/flows/rest/BUSINE_TRIP_REQUES_SUBMIT_INT/1.0/DORSubmit/businessTrip"
      responseConfig: "apiResponse"
      requestHeaders: []
      method: "POST"
      requestBody: "{\n    \"personID\": \"${(profile.properties.value.personId)!''}\",\n  \"email\": \"${(profile.email)!''}\",\n    \"documentRecordsDFF\": [\n        {\n            \"tripType\": \"${tripType}\",\n            \"tripStartDate1\": \"${startDate}\",\n            \"tripEndDate1\": \"${endDate}\",\n            \"period\": ${period},\n            \"destinationCountry1\": \"${toCountry}\",\n            \"destinationCity\": \"${toCity}\",\n            \"toCountry1\": \"${toCountry}\",\n            \"toCity1\": \"${toCity}\",\n            \"tripStartDate2\": null,\n            \"tripEndDate2\": null,\n            \"period2\": null,\n            \"destinationCountry2\": null,\n            \"destinationCity2\": null,\n            \"ToCountry2\": null,\n            \"toCity2\": null,\n            \"tripStartDate3\": null,\n            \"tripEndDate3\": null,\n            \"perod3\": null,\n            \"destinationCountry3\": null,\n            \"destinationCity3\": null,\n            \"toCountry3\": null,\n            \"toCity3\": null,\n            \"reason\": \"${reason}\",\n            \"comments\": null\n        }\n    ]\n}"
      requestParameters: []
      resultVariable: "TripAPIResponse"
    transitions:
      next: "setTripSubmitResult"
    metadata:
      propertySheetIsFreeMarkerMap:
        authConfigType: false
        restService: false
        endpoint: false
        responseConfig: false
        method: false
        requestBody: true
        apiKeyValueVariable: false
        passwordVariable: false
        tokenVariable: false
        resultVariable: false
        requiresAuthorization: false
  clearConfirmReply:
    component: "System.ResetVariables"
    properties:
      variableList: "confirmReply,confirmResult"
    transitions:
      next: "confirmSummaryPrep"
    metadata:
      propertySheetIsFreeMarkerMap:
        variableList: false
        requiresAuthorization: false
  clearQuestionForList:
    component: "System.ResetVariables"
    properties:
      variableList: "skill.question"
    transitions:
      next: "askTripTypePrep"
    metadata:
      propertySheetIsFreeMarkerMap:
        variableList: false
        requiresAuthorization: false
  confirmSummaryPrep:
    component: "System.SetVariable"
    properties:
      variable: "skill.renderedMsg"
      value: "Please confirm your business trip request:\n🧳 Trip type: ${tripType}\n🌐 To: ${toCity}, ${toCountry}\n📅 ${startDate} → ${endDate} (${period} days)\nShall I submit it?"
    transitions:
      next: "confirmSummaryRender"
    metadata:
      propertySheetIsFreeMarkerMap:
        variable: false
        value: true
        requiresAuthorization: false
  confirmSummaryRender:
    component: "System.LLM"
    properties:
      outOfScopeKeyword: "InvalidInput"
      enableStreaming: false
      enableMultiTurn: false
      customActions: {}
      sendResponse: false
      addJsonSchemaInstruction: false
      promptTemplateParameters:
        langName: "${(skill.userLangName)!'English'}"
        textEn: "${(skill.renderedMsg)!''}"
      retries: 1
      submitButtonLabel: "Submit"
      validateJson: false
      cancelButtonLabel: "Cancel"
      jsonSchema: {}
      temperature: 0
      maxTokens: 400
      resultVariable: "skill.renderedMsg"
      standardActions: ""
      promptTemplate: "Write the TEXT below in ${langName}.\n\nLANGUAGE — ALREADY DECIDED BY THE SYSTEM, DO NOT DETECT IT:\n- If ${langName} is English, output the TEXT unchanged, character for character.\n- Otherwise translate it completely and naturally into ${langName}, leaving no English words behind.\n- Never mix languages.\n- Keep every emoji, bullet, line break, number, date, currency and proper name exactly as it is and exactly where it is.\n- Do NOT add, remove, soften or invent any information.\n\nOutput ONLY the resulting text. No quotes, no labels, no explanation.\n\nTEXT\n${textEn}\n\nOUTPUT"
      undoButtonLabel: "Undo"
      retryUserMessage: "One moment please... لحظة من فضلك"
    transitions:
      actions:
        error: "confirmSummary"
      next: "confirmSummary"
    metadata:
      propertySheetIsFreeMarkerMap:
        functions: false
        enableStreaming: false
        outOfScopeMessage: true
        sendResponse: false
        addJsonSchemaInstruction: false
        startUserMessage: true
        cancelButtonLabel: true
        jsonSchema: false
        temperature: false
        maxTokens: false
        resultVariable: false
        standardActions: false
        validationEntities: false
        undoButtonLabel: true
        userPromptExpression: true
        retryUserMessage: true
        outOfScopeKeyword: false
        userPrompt: true
        enableMultiTurn: false
        retries: false
        submitButtonLabel: true
        validateJson: false
        promptTemplate: true
        eventHandler: false
        llmService: false
  confirmSummary:
    component: "System.CommonResponse"
    properties:
      variable: "confirmReply"
      processUserMessage: true
      prompt: "${skill.renderedMsg}"
    transitions:
      next: "classifyConfirm"
    metadata:
      virtualComponent: "Virtual.Question"
      propertySheetIsFreeMarkerMap:
        variable: false
        prompt: true
        requiresAuthorization: false
  classifyConfirm:
    component: "System.LLM"
    properties:
      outOfScopeKeyword: "InvalidInput"
      enableStreaming: false
      enableMultiTurn: false
      customActions: {}
      sendResponse: false
      addJsonSchemaInstruction: false
      promptTemplateParameters:
        confirmReply: "${((confirmReply)!'')?replace('<not set>','')}"
      retries: 1
      submitButtonLabel: "Submit"
      validateJson: false
      cancelButtonLabel: "Cancel"
      jsonSchema: {}
      temperature: 0
      maxTokens: 8
      resultVariable: "confirmResult"
      standardActions: ""
      promptTemplate: "The employee was shown a business trip summary and asked to confirm submitting it. Classify their reply into EXACTLY one word: YES, NO, or EDIT.\n\n- YES: a clear affirmative with NO change requested (yes, yeah, sure, ok, go ahead, confirm, submit, do it, نعم, ايوه, اي, أكيد, تمام, موافق, ارسل, ماشي).\n- EDIT: the employee wants to CHANGE or CORRECT a detail, or gives new/different information (a city, a date, a trip type) — EVEN IF the message starts with 'no'. Examples: 'no, make it Riyadh', 'change the dates to next week', 'by car not by air', 'لا خلها الرياض', 'غير التاريخ'.\n- NO: a pure cancel/refusal with NO new detail (no, nope, cancel, stop, never mind, لا, إلغاء, الغاء, كنسل, توقف).\n\nIf the reply contains ANY concrete detail (a city, a date, a trip type), choose EDIT, not NO.\n\nEmployee reply: \"${confirmReply}\"\n\nOutput EXACTLY one word: YES, NO, or EDIT."
      undoButtonLabel: "Undo"
      retryUserMessage: "One moment, please..."
    transitions:
      next: "switchConfirm"
    metadata:
      propertySheetIsFreeMarkerMap:
        outOfScopeKeyword: false
        enableStreaming: false
        userPrompt: true
        outOfScopeMessage: true
        enableMultiTurn: false
        sendResponse: false
        addJsonSchemaInstruction: false
        startUserMessage: true
        retries: false
        submitButtonLabel: true
        validateJson: false
        cancelButtonLabel: true
        jsonSchema: false
        temperature: false
        maxTokens: false
        resultVariable: false
        standardActions: false
        validationEntities: false
        undoButtonLabel: true
        userPromptExpression: true
        promptTemplate: true
        eventHandler: false
        retryUserMessage: true
        llmService: false
  checkResponse:
    component: "System.Switch"
    properties:
      variable: "tripSubmitResult"
    transitions:
      actions:
        "201": "outputSuccess"
      next: "showError"
    metadata:
      propertySheetIsFreeMarkerMap:
        variable: false
        source: true
        requiresAuthorization: false
  setEndDate:
    component: "System.SetVariable"
    properties:
      variable: "endDate"
      value: "${((tripLLMResponse?eval_json.endDate)!(endDate!''))?replace('<not set>','')}"
    transitions:
      next: "setPeriod"
    metadata:
      propertySheetIsFreeMarkerMap:
        variable: false
        value: true
        requiresAuthorization: false
  clearQuestion:
    component: "System.ResetVariables"
    properties:
      variableList: "skill.question"
    transitions:
      next: "question"
    metadata:
      propertySheetIsFreeMarkerMap:
        variableList: false
        requiresAuthorization: false
  setTripStatus:
    component: "System.SetVariable"
    properties:
      variable: "tripStatus"
      value: "${((tripLLMResponse?eval_json.status)!'incomplete')?trim?lower_case}"
    transitions:
      next: "switchTripStatus"
    metadata:
      propertySheetIsFreeMarkerMap:
        variable: false
        value: true
        requiresAuthorization: false
  showError:
    component: "System.SetVariable"
    properties:
      variable: "skill.renderedMsg"
      value: "❌ Your business trip request could not be submitted.\nReason: ${errorReason}\nPlease contact HR for assistance."
    transitions:
      next: "showErrorRender"
    metadata:
      propertySheetIsFreeMarkerMap:
        variable: false
        value: true
        requiresAuthorization: false
  showErrorRender:
    component: "System.LLM"
    properties:
      outOfScopeKeyword: "InvalidInput"
      enableStreaming: false
      enableMultiTurn: false
      customActions: {}
      sendResponse: false
      addJsonSchemaInstruction: false
      promptTemplateParameters:
        langName: "${(skill.userLangName)!'English'}"
        textEn: "${(skill.renderedMsg)!''}"
      retries: 1
      submitButtonLabel: "Submit"
      validateJson: false
      cancelButtonLabel: "Cancel"
      jsonSchema: {}
      temperature: 0
      maxTokens: 400
      resultVariable: "skill.renderedMsg"
      standardActions: ""
      promptTemplate: "Write the TEXT below in ${langName}.\n\nLANGUAGE — ALREADY DECIDED BY THE SYSTEM, DO NOT DETECT IT:\n- If ${langName} is English, output the TEXT unchanged, character for character.\n- Otherwise translate it completely and naturally into ${langName}, leaving no English words behind.\n- Never mix languages.\n- Keep every emoji, bullet, line break, number, date, currency and proper name exactly as it is and exactly where it is.\n- Do NOT add, remove, soften or invent any information.\n\nOutput ONLY the resulting text. No quotes, no labels, no explanation.\n\nTEXT\n${textEn}\n\nOUTPUT"
      undoButtonLabel: "Undo"
      retryUserMessage: "One moment please... لحظة من فضلك"
    transitions:
      actions:
        error: "showErrorOut"
      next: "showErrorOut"
    metadata:
      propertySheetIsFreeMarkerMap:
        functions: false
        enableStreaming: false
        outOfScopeMessage: true
        sendResponse: false
        addJsonSchemaInstruction: false
        startUserMessage: true
        cancelButtonLabel: true
        jsonSchema: false
        temperature: false
        maxTokens: false
        resultVariable: false
        standardActions: false
        validationEntities: false
        undoButtonLabel: true
        userPromptExpression: true
        retryUserMessage: true
        outOfScopeKeyword: false
        userPrompt: true
        enableMultiTurn: false
        retries: false
        submitButtonLabel: true
        validateJson: false
        promptTemplate: true
        eventHandler: false
        llmService: false
  showErrorOut:
    component: "System.CommonResponse"
    properties:
      metadata:
        responseItems:
        - text: "${skill.renderedMsg}"
          type: "text"
      keepTurn: true
    transitions:
      next: "appendTxnHistory"
    metadata:
      virtualComponent: "Virtual.Output"
      propertySheetIsFreeMarkerMap:
        requiresAuthorization: false
  setReason:
    component: "System.SetVariable"
    properties:
      variable: "reason"
      value: "${((tripLLMResponse?eval_json.reason)!(reason!''))?replace('<not set>','')}"
    transitions:
      next: "setTripStatus"
    metadata:
      propertySheetIsFreeMarkerMap:
        variable: false
        value: true
        requiresAuthorization: false
  switchTripStatus:
    component: "System.Switch"
    properties:
      variable: "tripStatus"
    transitions:
      actions:
        incomplete: "clearQuestion"
        complete: "checkTripType"
        cancel: "outputCancelled"
        offtopic: "rerouteToLoop"
      next: "clearQuestion"
    metadata:
      propertySheetIsFreeMarkerMap:
        variable: false
        source: true
        requiresAuthorization: false
  checkTripType:
    component: "System.Switch"
    properties:
      source: "${((tripType!'')?trim?length gt 0)?then('OK','MISSING')}"
    transitions:
      actions:
        OK: "clearConfirmReply"
        MISSING: "clearQuestionForList"
    metadata:
      propertySheetIsFreeMarkerMap:
        variable: false
        source: true
        requiresAuthorization: false
  cleanTripJson:
    component: "System.SetVariable"
    properties:
      variable: "tripLLMResponse"
      value: "${\"{\" + (tripLLMResponse?keep_after(\"{\"))?keep_before_last(\"}\") + \"}\"}"
    transitions:
      next: "setTripType"
    metadata:
      propertySheetIsFreeMarkerMap:
        variable: false
        value: true
        requiresAuthorization: false
  setTripType:
    component: "System.SetVariable"
    properties:
      variable: "tripType"
      value: "${({\"domestic training trip - by air\":\"Domestic Training Trip - By AIR\",\"domestic training trip - using own car\":\"Domestic Training Trip - Using Own Car\",\"domestic trip - by air\":\"Domestic Trip - By AIR\",\"domestic trip - more than 15 days (long -term) using own car\":\"Domestic Trip - More than 15 Days (Long -Term) Using Own Car\",\"domestic trip - more than 15 days (long -term) by air\":\"Domestic Trip - More than 15 Days (Long -Term) by AIR\",\"domestic trip - using own car\":\"Domestic Trip - Using Own Car\",\"overseas training trip - by air\":\"Overseas Training Trip - By AIR\",\"overseas trip - by air\":\"Overseas Trip - By AIR\",\"technician field business trip - company car\":\"Technician Field Business Trip - Company Car\",\"technician field business trip allowance more than 500 sar claim - company car\":\"Technician Field Business Trip Allowance more than 500 SAR Claim - Company Car\"})[((tripLLMResponse?eval_json.tripType)!'')?trim?lower_case]!''}"
    transitions:
      next: "setToCountry"
    metadata:
      propertySheetIsFreeMarkerMap:
        variable: false
        value: true
        requiresAuthorization: false
  setStartDate:
    component: "System.SetVariable"
    properties:
      variable: "startDate"
      value: "${((tripLLMResponse?eval_json.startDate)!(startDate!''))?replace('<not set>','')}"
    transitions:
      next: "setEndDate"
    metadata:
      propertySheetIsFreeMarkerMap:
        variable: false
        value: true
        requiresAuthorization: false
  resetVariables:
    component: "System.ResetVariables"
    properties:
      variableList: "tripType,toCountry,toCity,startDate,endDate,period,reason,tripLLMResponse,tripStatus,tripSubmitResult,TripAPIResponse,errorReason,confirmReply,confirmResult"
    transitions:
      next: "setnow"
    metadata:
      propertySheetIsFreeMarkerMap:
        variableList: false
        requiresAuthorization: false
  question:
    component: "System.CommonResponse"
    properties:
      variable: "skill.question"
      processUserMessage: true
      prompt: "${(tripLLMResponse?eval_json.message)!((((skill.userLang)!'en') == 'ar')?then('ما نوع رحلة العمل، وإلى أين، وفي أي تواريخ؟','Which type of business trip do you need, where are you travelling to, and on which dates?'))}"
    transitions:
      next: "invokeTripLLM"
    metadata:
      virtualComponent: "Virtual.Question"
      propertySheetIsFreeMarkerMap:
        variable: false
        prompt: true
        requiresAuthorization: false
  invokeTripLLM:
    component: "System.LLM"
    properties:
      outOfScopeKeyword: "InvalidInput"
      enableStreaming: false
      enableMultiTurn: true
      customActions: {}
      sendResponse: false
      addJsonSchemaInstruction: true
      promptTemplateParameters:
        reason: "${((reason)!'')?replace('<not set>','')}"
        tripType: "${((tripType)!'')?replace('<not set>','')}"
        question: "${((skill.question)!'')?replace('<not set>','')}"
        origMsg: "${(skill.userQuestion)!''}"
        history: "${(skill.questionAnswerHistory)!''}"
        langName: "${(skill.userLangName)!'English'}"
        endDate: "${((endDate)!'')?replace('<not set>','')}"
        toCity: "${((toCity)!'')?replace('<not set>','')}"
        startDate: "${((startDate)!'')?replace('<not set>','')}"
        toCountry: "${((toCountry)!'')?replace('<not set>','')}"
      retries: 1
      submitButtonLabel: "Submit"
      validateJson: false
      cancelButtonLabel: "Cancel"
      jsonSchema: {}
      temperature: 0
      maxTokens: 1024
      resultVariable: "tripLLMResponse"
      standardActions: ""
      promptTemplate: "You are a friendly HR assistant helping an employee submit a Business Trip Request.\n\nLANGUAGE — ALREADY DECIDED BY THE SYSTEM, DO NOT DETECT IT: write EVERY \"message\" ENTIRELY in ${langName}, on every turn. Do NOT detect, guess or switch the language, and do NOT infer it from any text below — the memory and the examples contain both Arabic and English, and none of that affects your output. If ${langName} is Arabic every \"message\" is 100% Arabic; if ${langName} is English every \"message\" is 100% English. Never copy example text verbatim — express the idea in ${langName}. All JSON keys and values (tripType, country, dates) are ALWAYS English.\n\nORIGINAL REQUEST (context only — NOT a language signal)\n${origMsg}\n\nCURRENT COLLECTED VALUES\n- tripType: ${tripType}\n- toCountry: ${toCountry}\n- toCity: ${toCity}\n- startDate: ${startDate}\n- endDate: ${endDate}\n- reason: ${reason}\n\nPREVIOUS CONVERSATION AND PAST TRANSACTIONS (memory)\n${history}\n\nUse this memory ONLY to resolve explicit references to something earlier — e.g. \"same destination as last time\", \"same trip type as before\". NEVER auto-fill a field from memory unless the employee actually referred to it.\n\nEMPLOYEE JUST SAID (latest input)\n${question}\n\nYOUR JOB\nCollect: tripType, toCountry, toCity, startDate, endDate. reason is OPTIONAL (never block on it).\n\nTRIP TYPE — must be EXACTLY one of these (copy verbatim, keep spacing and casing):\n- Domestic Training Trip - By AIR\n- Domestic Training Trip - Using Own Car\n- Domestic Trip - By AIR\n- Domestic Trip - More than 15 Days (Long -Term) Using Own Car\n- Domestic Trip - More than 15 Days (Long -Term) by AIR\n- Domestic Trip - Using Own Car\n- Overseas Training Trip - By AIR\n- Overseas Trip - By AIR\n- Technician Field Business Trip - Company Car\n- Technician Field Business Trip Allowance more than 500 SAR Claim - Company Car\nMap the user's words to the closest value. Examples: \"domestic flight\"→Domestic Trip - By AIR; \"domestic by car\"→Domestic Trip - Using Own Car; \"overseas flight\"→Overseas Trip - By AIR; \"long domestic own car\"→Domestic Trip - More than 15 Days (Long -Term) Using Own Car; \"training abroad\"→Overseas Training Trip - By AIR; \"technician company car\"→Technician Field Business Trip - Company Car. If you cannot tell which one, leave tripType empty and ask the user to choose from the list.\n\nCOUNTRY: If the employee gives a destination city but not a country, AUTOMATICALLY infer toCountry from that city and fill it yourself — do NOT ask. Examples: Dubai/Abu Dhabi → United Arab Emirates; Jeddah/Riyadh/Dammam/Mecca/Medina → Saudi Arabia; London/Manchester → United Kingdom; Cairo → Egypt; Macao → Macao; Paris → France; New York → United States; Mumbai/Delhi → India; Manila → Philippines. Output toCountry as the standard English country name. Only ask for the country if the city is genuinely ambiguous or you cannot determine it. NEVER ask for the country when it can be inferred from the city.\nDATES: YYYY-MM-DD. Convert relative dates using today. If only one date is given, ask for the other.\nPERIOD: compute period = number of days from startDate to endDate (endDate minus startDate), as an integer.\n\nSTATUS\nCASE A — tripType + toCountry + toCity + startDate + endDate all present:\n{\"status\":\"complete\",\"tripType\":\"...\",\"toCountry\":\"...\",\"toCity\":\"...\",\"startDate\":\"YYYY-MM-DD\",\"endDate\":\"YYYY-MM-DD\",\"period\":0,\"reason\":\"...\"}\nDo NOT ask for confirmation. No \"message\" field when complete.\n\nCASE B — something missing:\n{\"status\":\"incomplete\",\"tripType\":\"...\",\"toCountry\":\"...\",\"toCity\":\"...\",\"startDate\":\"...\",\"endDate\":\"...\",\"message\":\"ask ONLY for the next missing field\"}\nAsk ONE thing at a time, in order: tripType (show the list), destination city, start date, end date. Do NOT ask for the destination country as a separate question when you can infer it from the city; only ask for the country if the city is ambiguous.\n\nCASE C — unclear: {\"status\":\"incomplete\",\"tripType\":\"\",\"toCountry\":\"\",\"toCity\":\"\",\"startDate\":\"\",\"endDate\":\"\",\"message\":\"<a short message, IN THE ORIGINAL REQUEST'S LANGUAGE, saying you did not catch that and asking what kind of trip, where to, and on which dates>\"}\n\nCASE D — the employee wants to CANCEL the trip request (\"cancel\", \"stop\", \"never mind\", \"الغاء\", \"إلغاء\", \"لا اريد\", \"خلاص\"): {\"status\":\"cancel\",\"tripType\":\"\",\"toCountry\":\"\",\"toCity\":\"\",\"startDate\":\"\",\"endDate\":\"\"}\n\nCASE E — the employee's LATEST input is a DIFFERENT request entirely — not trip details and not a correction: a greeting alone (hello, مرحبا), leave balance, payslip, attendance, absence history, submitting a leave, a policy question, bank account, personal/employment info: {\"status\":\"offtopic\",\"tripType\":\"\",\"toCountry\":\"\",\"toCity\":\"\",\"startDate\":\"\",\"endDate\":\"\"}\nIMPORTANT: CHANGING or CORRECTING trip details (\"make it Riyadh instead\", \"no, by car\", \"بدل التاريخ\") is NEVER cancel or offtopic — update the value and continue. An EXPLANATION with extra context is NOT offtopic — extract the useful values and continue.\n\nRULES: Respond with JSON ONLY. status is one of: complete, incomplete, cancel, offtopic. Never ask the user to confirm. tripType must be exact from the list or empty. reason is optional. The \"message\" field must be in the ORIGINAL REQUEST's language."
      undoButtonLabel: "Undo"
      retryUserMessage: "One moment, please..."
    transitions:
      next: "cleanTripJson"
    metadata:
      propertySheetIsFreeMarkerMap:
        functions: false
        enableStreaming: false
        outOfScopeMessage: true
        sendResponse: false
        addJsonSchemaInstruction: false
        startUserMessage: true
        cancelButtonLabel: true
        jsonSchema: false
        temperature: false
        maxTokens: false
        resultVariable: false
        standardActions: false
        validationEntities: false
        undoButtonLabel: true
        userPromptExpression: true
        retryUserMessage: true
        outOfScopeKeyword: false
        userPrompt: true
        enableMultiTurn: false
        retries: false
        submitButtonLabel: true
        validateJson: false
        promptTemplate: true
        eventHandler: false
        llmService: false
  setToCountry:
    component: "System.SetVariable"
    properties:
      variable: "toCountry"
      value: "${((tripLLMResponse?eval_json.toCountry)!(toCountry!''))?replace('<not set>','')}"
    transitions:
      next: "setToCity"
    metadata:
      propertySheetIsFreeMarkerMap:
        variable: false
        value: true
        requiresAuthorization: false
  setPeriod:
    component: "System.SetVariable"
    properties:
      variable: "period"
      value: "${(tripLLMResponse?eval_json.period)!'0'}"
    transitions:
      next: "setReason"
    metadata:
      propertySheetIsFreeMarkerMap:
        variable: false
        value: true
        requiresAuthorization: false
  outputCancelled:
    component: "System.SetVariable"
    properties:
      variable: "skill.renderedMsg"
      value: "Okay, I've cancelled the business trip request. Tell me again whenever you're ready."
    transitions:
      next: "outputCancelledRender"
    metadata:
      propertySheetIsFreeMarkerMap:
        variable: false
        value: true
        requiresAuthorization: false
  outputCancelledRender:
    component: "System.LLM"
    properties:
      outOfScopeKeyword: "InvalidInput"
      enableStreaming: false
      enableMultiTurn: false
      customActions: {}
      sendResponse: false
      addJsonSchemaInstruction: false
