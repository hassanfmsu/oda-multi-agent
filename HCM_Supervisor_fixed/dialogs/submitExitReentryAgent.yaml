  system: false
- name: "feeClass"
  type: "string"
  metadata:
    isFreeMarker: true
  system: false
- name: "iqamaExpiry"
  type: "string"
  metadata:
    isFreeMarker: true
  system: false
- name: "iqamaClass"
  type: "string"
  metadata:
    isFreeMarker: true
  system: false
- name: "visaTypeReply"
  type: "string"
  metadata:
    isFreeMarker: true
