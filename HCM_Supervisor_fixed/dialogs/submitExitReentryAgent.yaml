name: "submitExitReentryAgent"
trackingId: "AAAA000F-0000-0000-0000-00000000000F"
type: "task"
version: "2.0"
interface: {}
configuration:
  requiresAuthorization: false
  defaultApplicationContext: false
  privateThread: false
variables:
- name: "langCode"
  type: "string"
  metadata:
    isFreeMarker: true
  system: false
- name: "questionsJson"
  type: "string"
  metadata:
    isFreeMarker: true
  system: false
- name: "visaType"
  type: "string"
  metadata:
    isFreeMarker: true
  system: false
- name: "visaTypeClass"
  type: "string"
  metadata:
    isFreeMarker: true
  system: false
- name: "toDate"
  type: "string"
  metadata:
    isFreeMarker: true
  system: false
- name: "validaty"
  type: "string"
  metadata:
    isFreeMarker: true
  system: false
- name: "periodDays"
  type: "string"
  metadata:
    isFreeMarker: true
  system: false
- name: "traficViolation"
  type: "string"
  metadata:
    isFreeMarker: true
  system: false
- name: "traficClass"
  type: "string"
  metadata:
    isFreeMarker: true
